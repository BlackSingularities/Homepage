services:
  homepage:
    build: .
    container_name: homepage
    restart: unless-stopped
    depends_on:
      - homepage_api
      - homepage_gallery
    networks:
      - webproxy
      - homepage_internal

  homepage_api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: homepage_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Deploys wipe the app directory, so production points this at a path
      # outside it (set in .env). Locally it stays ./data.
      - ${HOMEPAGE_DATA_DIR:-./data}:/app/data
      # Pamięć podręczna danych okolicy GRANI (odpowiedzi Overpass): wolumen Dockera, nie katalog
      # danych – przetrwa wdrożenia, ale nie trafia do kopii zapasowych (da się pobrać od nowa).
      - gran_cache:/app/cache
    environment:
      GRAN_CACHE_DIR: /app/cache
    networks:
      - homepage_internal
      # Tylko ruch wychodzący (GitHub z wydaniami aplikacji, poczta).
      # Sieć wewnętrzna nie ma wyjścia do internetu; ta nie wystawia portów.
      - homepage_egress

  homepage_gallery:
    build:
      context: ./gallery
    container_name: homepage_gallery
    restart: unless-stopped
    depends_on:
      - homepage_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
      HOMEPAGE_API_URL: http://homepage_api:3001
      GALLERY_JWT_SECRET: ${GALLERY_JWT_SECRET}
      UPLOADS_DIR: /app/persist/uploads
      THUMBS_DIR: /app/persist/thumbs
      # Warianty poglądowe (z wypalonym podpisem) – jedyne pliki, jakie
      # galeria wysyła gościom. Podpis zmienia GALLERY_WATERMARK, pusta
      # wartość go wyłącza.
      DISPLAY_DIR: /app/persist/display
      GALLERY_WATERMARK: ${GALLERY_WATERMARK:-redzikowski.com}
      DB_PATH: /app/persist/db/galeria.db
    volumes:
      - ${HOMEPAGE_GALLERY_DATA_DIR:-./gallery/persist}:/app/persist
    networks:
      - webproxy
      - homepage_internal

volumes:
  gran_cache:

networks:
  webproxy:
    name: webproxy
    external: true
  homepage_internal:
    internal: true
  homepage_egress:
    driver: bridge
