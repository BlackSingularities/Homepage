<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg: #0c0b0a;
    --bg-lift: #161311;
    --line: rgba(255, 255, 255, .085);
    --line-gold: rgba(240, 204, 63, .38);
    --ink: #ede7dc;
    --ink-2: #a7a094;
    --ink-3: #7f796f;
    --accent: #f0cc3f;
    --accent-ink: #14100a;
    --font: 'Hanken Grotesk', system-ui, sans-serif;
    --display: 'Newsreader', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; position: relative; }

  #glyphs { position: absolute; inset: 0; z-index: 0; }
  .smoke { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(620px 420px at 88% 6%, rgba(240, 204, 63, .10), transparent 70%),
      radial-gradient(760px 520px at 8% 62%, rgba(240, 204, 63, .06), transparent 70%),
      linear-gradient(180deg, rgba(12, 11, 10, .25) 0%, rgba(12, 11, 10, .72) 34%, rgba(12, 11, 10, .55) 100%); }

  .poster { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 64px 64px 56px; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .wordmark { height: 30px; width: auto; opacity: .95; }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 11px 20px 11px 16px; border: 1px solid var(--line-gold);
    border-radius: 999px; font: 500 19px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
    background: rgba(240, 204, 63, .06); }
  .chip svg { width: 22px; height: 22px; fill: currentColor; }

  .head { display: flex; flex-direction: column; gap: 26px; align-items: center; text-align: center; margin-top: 56px; }
  .icon { width: 156px; height: 156px; flex: none; }
  .icon img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 18px 34px rgba(0, 0, 0, .55)); }
  .name { font: 500 92px/.98 var(--display); letter-spacing: -.02em; }
  .label { margin-top: 16px; font: 400 21px/1.3 var(--mono); color: var(--ink-3); letter-spacing: .02em; }

  .title { margin: 48px auto 0; font: 400 60px/1.1 var(--display); letter-spacing: -.015em; max-width: 920px; text-align: center; }
  .title em { font-style: italic; color: var(--accent); }
  .lead { margin: 24px auto 0; font: 400 28px/1.5 var(--font); color: var(--ink-2); max-width: 900px; text-align: center; }

  .stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; margin: 40px -40px 0; min-height: 0; }
  .stage::before { content: ''; position: absolute; inset: 10% 8%; background: radial-gradient(closest-side, rgba(240, 204, 63, .13), transparent); filter: blur(10px); }

  /* telefony */
  .phones { position: relative; display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
  .phone-col { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .phone-col:nth-child(even) { margin-top: 64px; }
  /* Realistyczna obudowa: cienka, równa ramka i promień rogu jak w prawdziwym ekranie (~7% szerokości). */
  .phone { position: relative; border-radius: 24px; padding: 6px; background: #050505;
    box-shadow: 0 0 0 1.5px #3a3732, 0 0 0 2.5px #141210, inset 0 0 0 1px rgba(255, 255, 255, .06), 0 34px 70px rgba(0, 0, 0, .65); }
  .phone img { display: block; border-radius: 18px; object-fit: cover; object-position: top; background: #000; }
  .phone::before { content: ''; position: absolute; top: 13px; left: 50%; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2a2a30, #050505 70%); box-shadow: 0 0 0 1px rgba(255, 255, 255, .05); z-index: 2; }
  .phone::after { content: ''; position: absolute; right: -4px; top: 22%; width: 3px; height: 15%; border-radius: 0 2px 2px 0; background: #2c2925;
    box-shadow: 0 calc(var(--h, 500px) * .2) 0 0 #2c2925; }
  .phone.ios { border-radius: 30px; padding: 7px; }
  .phone.ios img { border-radius: 23px; }
  .phone.ios::before { width: 30%; height: 13px; margin-left: -15%; border-radius: 8px; background: #050505; top: 15px; }

  /* okna */
  .windows { position: relative; display: grid; gap: 26px; width: 100%; padding: 0 24px; }
  .windows .row { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .win { border-radius: 14px; overflow: hidden; background: #1a1714;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 36px 80px rgba(0, 0, 0, .6); }
  .win-bar { height: 34px; display: flex; align-items: center; justify-content: flex-end; gap: 22px; padding: 0 16px;
    background: #201d19; border-bottom: 1px solid var(--line); }
  .win-bar.small { height: 26px; gap: 16px; padding: 0 12px; }
  .win-bar i { width: 11px; height: 11px; border: 1.5px solid rgba(237, 231, 220, .45); border-radius: 2px; }
  .win-bar i:first-child { height: 0; border-width: 1.5px 0 0; border-radius: 0; }
  .win-bar i:last-child { border: 0; position: relative; }
  .win-bar i:last-child::before, .win-bar i:last-child::after { content: ''; position: absolute; left: -1px; top: 5px; width: 13px; height: 1.5px;
    background: rgba(237, 231, 220, .45); transform: rotate(45deg); }
  .win-bar i:last-child::after { transform: rotate(-45deg); }
  .win-title { margin-right: auto; font: 500 15px/1 var(--font); color: var(--ink-3); }
  .win img { display: block; width: 100%; object-fit: cover; object-position: top left; }

  .cap { text-align: center; }
  .cap b { display: block; font: 600 26px/1.2 var(--font); color: var(--ink); }
  .cap span { display: block; margin-top: 7px; font: 400 18px/1.35 var(--font); color: var(--ink-3); }
  .windows .cap { text-align: left; margin-top: 14px; }

  .feats { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 40px; }
  .feat { display: inline-flex; align-items: center; padding: 12px 22px; border-radius: 999px;
    background: rgba(255, 255, 255, .045); box-shadow: inset 0 0 0 1px var(--line); font: 500 21px/1.2 var(--font); color: var(--ink-2); }

  .foot { display: flex; align-items: center; gap: 32px; margin-top: 40px; padding: 28px; border-radius: 22px;
    background: rgba(22, 19, 17, .88); box-shadow: inset 0 0 0 1px var(--line); }
  .foot .divider { height: 1px; }
  .qr { width: 168px; height: 168px; flex: none; padding: 12px; border-radius: 16px; background: var(--ink); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .cta { flex: 1; min-width: 0; }
  .cta .k { font: 500 18px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .cta .v { margin-top: 14px; font: 500 40px/1.1 var(--display); }
  .cta .u { margin-top: 14px; font: 400 21px/1.3 var(--mono); color: var(--ink-2); word-break: break-all; }
  .cta .m { margin-top: 10px; font: 400 18px/1.3 var(--mono); color: var(--ink-3); }
</style>
</head>
<body>
<canvas id="glyphs" width="1080" height="1920"></canvas>
<div class="smoke"></div>
<main class="poster" id="poster"></main>
<script>
const S = window.SPEC
const ICONS = {
  android: '<svg viewBox="0 0 24 24"><path d="M17.6 9.48l1.84-3.18a.38.38 0 0 0-.66-.38l-1.86 3.22a11.4 11.4 0 0 0-9.84 0L5.22 5.92a.38.38 0 0 0-.66.38L6.4 9.48A10.8 10.8 0 0 0 1 18h22a10.8 10.8 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>',
  windows: '<svg viewBox="0 0 24 24"><path d="M3 5.1l7.4-1v7.2H3V5.1zm0 13.8l7.4 1v-7.1H3v6.1zm8.2 1.1L21 21.4v-8.6h-9.8V20zm0-15.9v7.2H21V2.6l-9.8 1.5z"/></svg>',
  ios: '<svg viewBox="0 0 24 24"><path d="M16.4 12.7c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 5.1c.7-.9 1.2-2 1-3.2-1 .1-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>',
  linux: '<svg viewBox="0 0 24 24"><path d="M12 2c-2 0-3.2 1.7-3.2 4 0 1.3.3 2.3-.6 3.6C7 11.2 5.6 13.3 5.6 15.6c0 .6.1 1.1.3 1.6-.8.4-1.9.6-1.9 1.6 0 1.3 2 1.2 3 1.8 1 .6 1.8 1.4 3 1.4 1.1 0 1.6-.6 2-1.1.4.5.9 1.1 2 1.1 1.2 0 2-.8 3-1.4s3-.5 3-1.8c0-1-1.1-1.2-1.9-1.6.2-.5.3-1 .3-1.6 0-2.3-1.4-4.4-2.6-6-.9-1.3-.6-2.3-.6-3.6C15.2 3.7 14 2 12 2z"/></svg>',
}
const PLATFORM_NAME = { android: 'Android', windows: 'Windows', ios: 'iPhone i iPad', linux: 'Linux' }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
// *akcent* w tytule → złota kursywa
const rich = s => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>')

function phones() {
  const n = S.shots.length
  const w = n >= 4 ? 216 : n === 3 ? 270 : 310
  const h = Math.round(w * (S.ratio || 2.222))
  return `<div class="phones">${S.shots.map(s => `
    <div class="phone-col">
      <div class="phone ${S.platform === 'ios' ? 'ios' : ''}"><img src="${esc(s.src)}" style="width:${w}px;height:${h}px"></div>
      <div class="cap" style="width:${w + 20}px"><b>${esc(s.caption)}</b></div>
    </div>`).join('')}</div>`
}

function win(s, small, height) {
  return `<div><div class="win"><div class="win-bar ${small ? 'small' : ''}">${small ? '' : `<span class="win-title">${esc(S.name)}</span>`}<i></i><i></i><i></i></div>
    <img src="${esc(s.src)}" style="height:${height}px"></div>
    <div class="cap"><b>${esc(s.caption)}</b>${s.sub ? `<span>${esc(s.sub)}</span>` : ''}</div></div>`
}

function windows() {
  const [main, ...rest] = S.shots
  const big = Math.round(984 * (main.ratio || 0.5625))
  const smallH = Math.round(479 * 0.5625)
  return `<div class="windows">${win(main, false, Math.min(big, 560))}
    ${rest.length ? `<div class="row">${rest.slice(0, 2).map(s => win(s, true, smallH)).join('')}</div>` : ''}</div>`
}

document.getElementById('poster').innerHTML = `
  <div class="top">
    <img class="wordmark" src="${esc(S.wordmark)}">
    <span class="chip">${ICONS[S.platform] || ''}${esc(PLATFORM_NAME[S.platform] || S.platform)}</span>
  </div>
  <div class="head">
    <div class="icon"><img src="${esc(S.icon)}"></div>
    <div><div class="name">${esc(S.name)}</div><div class="label">${esc(S.label)}</div></div>
  </div>
  <h1 class="title">${rich(S.title)}</h1>
  <p class="lead">${esc(S.lead)}</p>
  <div class="stage">${S.layout === 'windows' ? windows() : phones()}</div>
  ${S.features?.length ? `<div class="feats">${S.features.map(f => `<span class="feat">${esc(f)}</span>`).join('')}</div>` : ''}
  <div class="foot">
    <div class="qr">${S.qr}</div>
    <div class="cta">
      <div class="k">${esc(S.ctaKicker || 'Pobierz za darmo')}</div>
      <div class="v">${esc(S.ctaTitle)}</div>
      <div class="u">${esc(S.url.replace(/^https?:\/\//, ''))}</div>
      ${S.meta ? `<div class="m">${esc(S.meta)}</div>` : ''}
    </div>
  </div>`

// Tło: ta sama siatka znaków co GlyphField na stronie, rysowana raz.
;(function glyphs() {
  const c = document.getElementById('glyphs'), g = c.getContext('2d')
  const CH = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
  let seed = [...S.slug + S.platform].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7)
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296)
  const hash = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296 }
  const noise = (x, y, s) => { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy)
    const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), cc = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s)
    return a + (b - a) * sx + (cc - a) * sy + (a - b - cc + d) * sx * sy }
  const s0 = Math.floor(rnd() * 1000)
  g.font = '13px "JetBrains Mono", monospace'; g.textBaseline = 'top'
  for (let y = 0; y < 1920; y += 18) for (let x = 0; x < 1080; x += 13) {
    const n = noise(x / 170, y / 170, s0) * .7 + noise(x / 60, y / 60, s0 + 1) * .3
    const smoke = Math.max(0, (n - .52) / .48)
    const a = .03 + smoke * .34
    g.fillStyle = smoke > .15 ? `rgba(240,204,63,${a * .55})` : `rgba(237,231,220,${a})`
    g.fillText(CH[Math.floor(rnd() * CH.length)], x, y)
  }
})()
// Nagłówek w jednej linii: zmniejszamy czcionkę, aż przestanie się łamać (najmniej 42 px).
function fitTitle() {
  const t = document.querySelector('.title')
  let size = 60
  t.style.whiteSpace = 'nowrap'
  while (t.scrollWidth > t.clientWidth && size > 42) { size -= 1; t.style.fontSize = size + 'px' }
  if (t.scrollWidth > t.clientWidth) t.style.whiteSpace = 'normal'
}
document.fonts.ready.then(() => { fitTitle(); document.body.dataset.ready = '1' })
</script>
</body>
</html>
