<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="OpenPayments – budżet domowy ze skanowaniem paragonów">
  <rect width="1600" height="1000" fill="#000000"/>
