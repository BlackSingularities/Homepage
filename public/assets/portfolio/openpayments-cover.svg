      <circle r="78" fill="none" stroke="#ffffff" stroke-width="26" stroke-dasharray="204 286" transform="rotate(-90)"/>
      <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="26" stroke-dasharray="110 380" stroke-dashoffset="-208" transform="rotate(-90)"/>
