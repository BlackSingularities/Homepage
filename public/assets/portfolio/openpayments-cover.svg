    <text x="664" y="420" font-size="84" font-weight="700" fill="#ffffff" font-family="Georgia, serif">2 840 zł</text>
    <text x="664" y="476" font-size="24" fill="#8a8a8a">Budżet 3 500 zł · zostało 660 zł</text>
    <rect x="664" y="508" width="792" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="664" y="508" width="643" height="14" rx="7" fill="#ffffff"/>

    <!-- kategorie -->
    <rect x="616" y="608" width="888" height="250" rx="30" fill="#ffffff" fill-opacity="0.06"/>
    <g transform="translate(760 733)">
