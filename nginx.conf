server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cala strona za haslem (HTTP Basic Auth) - dotyczy tez plikow JS/CSS/obrazow,
    # zeby nie dalo sie pobrac bundla z pominieciem logowania.
    auth_basic "Strona prywatna";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    location ~* \.(js|css|woff2|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
