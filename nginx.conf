server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Publiczne adresy strony renderuje API: każdy dostaje własne meta,
    # hreflang, dane strukturalne i treść w HTML (patrz server/seo.mjs).
    # Gdy API nie odpowiada, nginx podaje zwykły index.html – strona działa dalej.
    location = / {
        include /etc/nginx/conf.d/seo-proxy.inc;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location ~ ^/en(/.*)?$ {
        include /etc/nginx/conf.d/seo-proxy.inc;
    }

    location ^~ /p/ {
        include /etc/nginx/conf.d/seo-proxy.inc;
    }

    location ~ ^/portfolio(/.*)?$ {
        include /etc/nginx/conf.d/seo-proxy.inc;
    }

    # Stary adres portfolio – na stałe przeniesiony.
    location ~ ^/realizacje(/.*)?$ {
        return 301 /portfolio$1;
    }

    location @spa {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location = /sitemap.xml {
        proxy_pass http://homepage_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    # Authentication and authorization are enforced by the API itself.
    location ^~ /api/admin/ {
        client_max_body_size 12m;
        proxy_pass http://homepage_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Project data and app downloads (streamed from private releases): no buffering, long transfers.
    location ^~ /api/projects/ {
        proxy_pass http://homepage_api:3001;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public API: site content, published pages, contact form.
    location ^~ /api/ {
        client_max_body_size 1m;
        proxy_pass http://homepage_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images uploaded through the admin panel.
    location ^~ /uploads/ {
        proxy_pass http://homepage_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "private, immutable";
        access_log off;
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        try_files /favicon.svg =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ =404;
    }
}
