server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Domyslnie cala homepage jest za haslem (HTTP Basic Auth) - dotyczy tez
    # plikow JS/CSS/obrazow homepage, zeby nie dalo sie pobrac bundla bez logowania.
    auth_basic "Strona prywatna";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Podstrony to osobne aplikacje (inne kontenery routowane przez reverse proxy).
    # NIE wymagaja hasla. Jesli zapytanie o nie trafi do tego nginx, przepuszczamy je
    # bez auth (a nie podstawiamy index.html homepage, stad =404 zamiast SPA fallback).
    location ~ ^/(open-notebook|galeria|travels|kompendium-podroznicze|navigator|kompendium-it|jezyki-ai)(/|$) {
        auth_basic off;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    location ~* \.(js|css|woff2|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
