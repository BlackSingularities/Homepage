server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Basic Auth ma chronic tylko sama homepage. Pozostale sciezki tego hosta
    # naleza do osobnych aplikacji routowanych przez zewnetrzny reverse proxy.
    # Jesli request przez pomylke trafi tutaj, ma dostac 404 bez prompta logowania.
    location = / {
        auth_basic "Strona prywatna";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }

    location = /index.html {
        auth_basic "Strona prywatna";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        auth_basic "Strona prywatna";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "private, immutable";
        access_log off;
    }

    location = /favicon.svg {
        auth_basic off;
        try_files /favicon.svg =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        auth_basic off;
        try_files /favicon.svg =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    location / {
        auth_basic off;
        try_files $uri $uri/ =404;
    }
}
