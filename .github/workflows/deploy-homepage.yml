name: Deploy Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homepage-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOMEPAGE_SSH_HOST }}
          username: ${{ secrets.HOMEPAGE_SSH_USER }}
          password: ${{ secrets.HOMEPAGE_SSH_PASSWORD }}
          port: ${{ secrets.HOMEPAGE_SSH_PORT }}
          source: "."
          target: "/opt/apps/homepage"
          rm: true
          overwrite: true
          tar_dereference: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOMEPAGE_SSH_HOST }}
          username: ${{ secrets.HOMEPAGE_SSH_USER }}
          password: ${{ secrets.HOMEPAGE_SSH_PASSWORD }}
          port: ${{ secrets.HOMEPAGE_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/apps/homepage
            rm -rf .git node_modules dist
            docker compose up -d --build
