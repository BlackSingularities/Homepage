name: Deploy Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homepage-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOMEPAGE_SSH_HOST }}
          username: ${{ secrets.HOMEPAGE_SSH_USER }}
          password: ${{ secrets.HOMEPAGE_SSH_PASSWORD }}
          port: ${{ secrets.HOMEPAGE_SSH_PORT }}
          source: "."
          target: "/opt/apps/homepage"
          rm: true
          overwrite: true
          tar_dereference: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOMEPAGE_SSH_HOST }}
          username: ${{ secrets.HOMEPAGE_SSH_USER }}
          password: ${{ secrets.HOMEPAGE_SSH_PASSWORD }}
          port: ${{ secrets.HOMEPAGE_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            # The copy step wipes /opt/apps/homepage on every deploy, so the
            # encryption key and the application data live next to it instead.
            PERSIST=/opt/apps/homepage-persist
            mkdir -p "$PERSIST/data"

            if [ ! -f "$PERSIST/env" ]; then
              umask 077
              {
                printf 'SETTINGS_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)"
                printf 'HOMEPAGE_DATA_DIR=%s\n' "$PERSIST/data"
              } > "$PERSIST/env"
            fi

            cd /opt/apps/homepage
            install -m 600 "$PERSIST/env" .env
            rm -rf .git node_modules dist

            docker compose up -d --build
            docker compose exec -T homepage_api node server/migrate-playmaster.mjs
            docker compose exec -T homepage_api node server/migrate-arcadia.mjs
            docker image prune -f
