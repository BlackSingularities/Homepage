name: Deploy Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homepage-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Klucz SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOMEPAGE_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "${{ secrets.HOMEPAGE_SSH_PORT || '22' }}" -H "${{ secrets.HOMEPAGE_SSH_HOST }}" >> ~/.ssh/known_hosts

      # Klucz wdrozeniowy jest na serwerze ograniczony do bramki /opt/apps/bin/ci-gate: "deploy" przyjmuje archiwum
      # repozytorium i uruchamia staly skrypt z serwera (/opt/apps/bin/ci.d/homepage.sh): sekrety w homepage-persist,
      # podmiana katalogu, sprawdzenie docker-compose, docker compose up --build, a potem polecenia z
      # deploy/post-deploy.txt (migracje) - wylacznie wewnatrz kontenerow projektu.
      - name: Deploy
        run: |
          tar -czf - --exclude=./.git . | ssh -i ~/.ssh/deploy -p "${{ secrets.HOMEPAGE_SSH_PORT || '22' }}" \
            "${{ secrets.HOMEPAGE_SSH_USER }}@${{ secrets.HOMEPAGE_SSH_HOST }}" deploy "$GITHUB_SHA"
